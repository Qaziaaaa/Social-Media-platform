<body class="bg-background text-on-surface antialiased">
<!-- Split Screen Layout -->
<div class="flex min-h-screen">
<!-- Left Pane: Image (Hidden on Mobile) -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface-container overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent z-10 mix-blend-multiply"></div>
<img alt="Workspace" class="absolute inset-0 w-full h-full object-cover z-0" data-alt="A bright, modern, and minimalist lifestyle photograph of young professionals collaborating and socializing in an airy, sunlit loft space. The environment features high ceilings, expansive windows, and clean, geometric architectural lines. The color palette emphasizes crisp whites, light airy grays, and soft natural lighting that creates a calm, focused mood, perfectly reflecting a premium, professional social networking aesthetic. The scene feels optimistic, connected, and distinctly high-quality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9ZyBKpk1HK8sv_4nqbgbAsmVx0jhNY3WmbhipZdi6IDSkJg4skRhTupoBYSx5JoYqaqtkilzXead3DkVFiRoMm4l8IkOKMgj6R56kRyT7aVOGtvVYvuOY8JA7A5w32YUruhtWhfY5VSaRZIUJOC0ntnt6Iwlfrc8o-XjURFA8dPEGojG92hX1Qp17o1R3a982oWNsQ6C8OgwVk2HtN5ugC7RCzSRITFKl1RsIJyRJIeIpENU_G1QhX256HBaMhkVpYOuh0kszbUs"/>
<div class="relative z-20 flex flex-col justify-end p-3xl h-full w-full">
<div class="bg-surface/80 backdrop-blur-md p-lg rounded-xl max-w-md shadow-lg border border-surface-container-lowest/50">
<p class="font-headline-md text-headline-md text-on-surface mb-sm">"The most intuitive way to connect with my professional network without the noise."</p>
<p class="font-body-md text-body-md text-on-surface-variant">— Alex R., Design Lead</p>
</div>
</div>
</div>
<!-- Right Pane: Registration Form -->
<div class="flex-1 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-2xl lg:py-3xl overflow-y-auto">
<div class="w-full max-w-md mx-auto">
<!-- Brand Anchor -->
<div class="mb-2xl flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-size: 32px; font-variation-settings: 'FILL' 1;">graphic_eq</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Lumina Social</span>
</div>
<!-- Header Content -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Create an account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join our professional community today.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="w-full px-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md transition-all placeholder:text-outline" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full px-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md transition-all placeholder:text-outline" id="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">Username</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-outline font-body-md text-body-md">@</span>
<input class="w-full pl-xl pr-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md transition-all placeholder:text-outline" id="username" placeholder="janedoe" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="w-full px-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Agreement Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<input class="mt-1 w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/50 bg-surface-container-lowest" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Primary CTA -->
<button class="w-full py-[12px] bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-on-primary-fixed-variant transition-colors mt-sm shadow-sm" type="submit">
                        Sign Up
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="flex-1 h-px bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">or sign up with</span>
<div class="flex-1 h-px bg-outline-variant/50"></div>
</div>
<!-- Social Sign Up -->
<div class="flex flex-col gap-md">
<button class="w-full flex items-center justify-center gap-sm py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md">
<span class="material-symbols-outlined text-on-surface" style="font-size: 20px;">account_circle</span>
                        Google
                    </button>
<button class="w-full flex items-center justify-center gap-sm py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md">
<span class="material-symbols-outlined text-on-surface" style="font-size: 20px;">devices</span>
                        Apple
                    </button>
</div>
<!-- Login Link -->
<div class="mt-2xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="font-label-md text-label-md text-primary hover:underline" href="#">Log in</a>
</p>
</div>
</div>
</div>
</div>
